services:
  postgres:
    image: postgres:16
    container_name: structagent-postgres
    environment:
      POSTGRES_USER: world
      POSTGRES_PASSWORD: world
      POSTGRES_DB: world
    ports:
      - "5544:5432"
    volumes:
      - structagent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U world -d world"]
      interval: 5s
      timeout: 3s
      retries: 10

  structapi:
    build:
      context: .
      dockerfile: structapi.Dockerfile
    container_name: structapi
    environment:
      STRUCTAPI_KEYS: ${STRUCTAPI_KEYS:-}
      STRUCTAPI_RATE_LIMIT: ${STRUCTAPI_RATE_LIMIT:-60}
    ports:
      - "8080:8080"

volumes:
  structagent-pgdata:
